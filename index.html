<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">

<!-- iOS PWA Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskSystem">
<link rel="apple-touch-icon" href="icon-192.png">

<title>TASK_SYSTEM // PWA</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    color: #e8e8e8;
    font-family: 'JetBrains Mono', 'Sarabun', monospace;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #0d0d0d;
    border: 1px solid #00ff88;
    padding: 24px;
    border-radius: 8px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
  }
  h1 { font-size: 20px; color: #00ff88; margin-bottom: 12px; }
  p { font-size: 13px; color: #999; margin-bottom: 20px; line-height: 1.5; }
  .btn-install {
    background: #00ff88;
    color: #050505;
    border: none;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
    border-radius: 4px;
  }
  .ios-instructions {
    display: none;
    background: #111;
    border: 1px dashed #ffaa00;
    color: #ffaa00;
    padding: 12px;
    font-size: 12px;
    margin-top: 15px;
    text-align: left;
    border-radius: 4px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>TASK_SYSTEM PWA</h1>
  <p>ระบบกำลังเรียก Pop-up ติดตั้งแอปพลิเคชันลงบนมือถือของคุณ...</p>
  
  <button id="installBtn" class="btn-install" onclick="triggerInstall()">📲 กดเพื่อติดตั้งแอป (INSTALL)</button>

  <div id="iosBox" class="ios-instructions">
    📱 <strong>วิธีติดตั้งสำหรับ iPhone / iPad (Safari):</strong><br>
    1. แตะปุ่ม <strong>"แชร์ (Share)"</strong> ด้านล่างเบราว์เซอร์<br>
    2. เลือก <strong>"เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)"</strong>
  </div>
</div>

<script>
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  const iosBox = document.getElementById('iosBox');

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  if (isIOS) {
    installBtn.style.display = 'none';
    iosBox.style.display = 'block';
  }

  // ดักจับ Event เมื่อเบราว์เซอร์พร้อมให้ติดตั้ง PWA
  window.addEventListener('beforeinstallprompt', (e) => {
    // ป้องกันไม่ให้ Chrome แสดง Banner แบบย่อด้านล่าง
    e.preventDefault();
    deferredPrompt = e;
    
    // สั่งให้ Pop-up ของระบบ Android เด้งขึ้นมากลางจอทันทีที่เปิดเว็บ!
    setTimeout(() => {
      triggerInstall();
    }, 500);
  });

  async function triggerInstall() {
    if (deferredPrompt) {
      deferredPrompt.prompt(); // แสดง Native Install Pop-up
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.innerText = '✅ ติดตั้งเรียบร้อยแล้ว';
      }
      deferredPrompt = null;
    }
  }

  // ลงทะเบียน Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('[PWA] Service Worker Registered!'))
        .catch(err => console.error('[PWA] Service Worker Failed:', err));
    });
  }
</script>
</body>
</html>

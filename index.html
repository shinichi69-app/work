<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskSystem">
<title>TASK_SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050505;
    --panel: #0d0d0d;
    --panel-2: #111111;
    --border: #1f1f1f;
    --border-2: #2a2a2a;
    --grid: rgba(255,255,255,0.03);
    --text: #e8e8e8;
    --text-dim: #6a6a6a;
    --text-mid: #999;
    --green: #00ff88;
    --red: #ff3355;
    --amber: #ffaa00;
    --cyan: #00d9ff;
  }

  html, body { height: 100%; }

  body {
    font-family: 'JetBrains Mono', 'Sarabun', monospace;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, transparent 0%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    padding: 28px;
  }
  .container::before, .container::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border: 1px solid var(--text-mid);
  }
  .container::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .container::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .logo-mark {
    color: var(--text-mid);
    font-size: 10px;
    letter-spacing: 2px;
    border: 1px solid var(--border-2);
    padding: 3px 8px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
  }
  h1 .accent { color: var(--green); }

  .header-right { display: flex; gap: 8px; align-items: center; }
  .sys-badge {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-mid);
    border: 1px solid var(--border-2);
    padding: 5px 10px;
    background: rgba(255,255,255,0.02);
    white-space: nowrap;
  }
  .sys-badge .val { color: var(--green); font-weight: 600; }
  .sys-badge .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .subtitle {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .subtitle::before { content: '> '; color: var(--green); }

  .thai-clock {
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
    padding: 20px 24px;
    margin-bottom: 20px;
    position: relative;
  }
  .thai-clock::before {
    content: 'SYS_TIME';
    position: absolute;
    top: -1px; left: 12px;
    background: var(--bg);
    padding: 0 8px;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    transform: translateY(-50%);
  }
  .clock-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .thai-clock .time {
    font-size: 34px;
    font-weight: 300;
    letter-spacing: 4px;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .thai-clock .time .sec { color: var(--green); font-size: 20px; }
  .thai-clock .period {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .thai-clock .period .hl { color: var(--cyan); }
  .thai-clock .date {
    font-size: 11px;
    color: var(--text-mid);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-2);
    letter-spacing: 1px;
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border-2);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 0.5px;
    transition: all 0.15s;
    border-radius: 0;
  }
  input[type="text"]::placeholder { color: #444; }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 1px rgba(0,255,136,0.2), 0 0 12px rgba(0,255,136,0.15);
    background: #0a0a0a;
  }

  .time-picker { display: flex; gap: 4px; align-items: center; }
  .time-picker select {
    padding: 12px 8px;
    background: var(--panel);
    border: 1px solid var(--border-2);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 0;
    letter-spacing: 0.5px;
  }
  .time-picker select:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 1px rgba(0,255,136,0.2);
  }
  .time-picker select option { background: #0a0a0a; color: var(--text); }
  .time-picker .sep { color: var(--text-mid); font-weight: 700; }

  button {
    padding: 12px 22px;
    border: 1px solid var(--border-2);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 0;
  }
  button:hover {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  button.primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  button.primary:hover {
    background: var(--green);
    border-color: var(--green);
    color: var(--bg);
    box-shadow: 0 0 20px rgba(0,255,136,0.4);
  }

  .notify-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 11px;
    margin-bottom: 18px;
    color: var(--text-mid);
    letter-spacing: 1px;
    cursor: pointer;
  }
  .notify-toggle input {
    width: 14px; height: 14px;
    cursor: pointer;
    accent-color: var(--green);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .stats > div {
    background: var(--panel);
    padding: 14px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .stats span strong {
    display: block;
    font-size: 22px;
    font-weight: 300;
    color: #fff;
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  .stats > div:nth-child(2) span strong { color: var(--green); }
  .stats > div:nth-child(3) span strong { color: var(--amber); }

  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    padding: 14px 16px;
    margin-bottom: 6px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--text-mid);
    transition: all 0.2s;
    animation: slideIn 0.3s ease;
    position: relative;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  li:hover {
    background: var(--panel-2);
    border-color: var(--border-2);
    border-left-color: var(--cyan);
  }
  li.done {
    opacity: 0.4;
    border-left-color: var(--green);
    background: #080808;
  }
  li.done .task-text { text-decoration: line-through; color: var(--text-dim); }
  li.overdue {
    border-left-color: var(--red);
    background: linear-gradient(90deg, rgba(255,51,85,0.06), transparent 60%);
  }
  li.soon {
    border-left-color: var(--amber);
    background: linear-gradient(90deg, rgba(255,170,0,0.06), transparent 60%);
  }

  .task-info { flex: 1; cursor: pointer; }
  .task-text {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    word-break: break-word;
    letter-spacing: 0.3px;
  }
  .task-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  li.overdue .task-time { color: var(--red); font-weight: 600; }
  li.soon .task-time { color: var(--amber); font-weight: 600; }

  .badge {
    display: inline-block;
    background: var(--border-2);
    color: var(--text-mid);
    font-size: 9px;
    font-weight: 600;
    padding: 2px 7px;
    margin-left: 8px;
    letter-spacing: 1px;
    vertical-align: middle;
    border: 1px solid transparent;
  }
  .badge.soon {
    background: transparent;
    border-color: var(--amber);
    color: var(--amber);
  }
  .badge.overdue {
    background: transparent;
    border-color: var(--red);
    color: var(--red);
  }

  .icon-btn {
    background: transparent;
    color: var(--text-dim);
    padding: 6px 10px;
    font-size: 14px;
    border: 1px solid transparent;
    letter-spacing: 0;
  }
  .icon-btn:hover {
    background: rgba(255,51,85,0.1);
    color: var(--red);
    border-color: var(--red);
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 30px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .empty::before { content: '[ '; color: var(--green); }
  .empty::after { content: ' ]'; color: var(--green); }

  .offline-badge {
    position: fixed;
    top: 10px;
    right: 10px;
    background: var(--amber);
    color: var(--bg);
    padding: 6px 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    z-index: 9998;
    display: none;
  }
  .offline-badge.show { display: block; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-mid); }
  ::selection { background: var(--green); color: var(--bg); }

  @media (max-width: 560px) {
    body { padding: 12px; }
    .container { padding: 20px 16px; }
    h1 { font-size: 15px; letter-spacing: 2px; }
    .thai-clock .time { font-size: 26px; letter-spacing: 2px; }
    .stats > div { padding: 10px 6px; font-size: 9px; }
    .stats span strong { font-size: 18px; }
    .time-picker select { padding: 10px 6px; font-size: 13px; }
    input[type="text"] { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="offline-badge" id="offlineBadge">⚠ OFFLINE</div>

<div class="container">
  <div class="header">
    <div class="header-left">
      <span class="logo-mark">SYS.01</span>
      <h1>TASK<span class="accent">_</span>SYSTEM</h1>
    </div>
    <div class="header-right">
      <div class="sys-badge"><span class="dot"></span>STATUS // <span class="val">ONLINE</span></div>
    </div>
  </div>

  <p class="subtitle">Daily task scheduler &amp; notification module</p>

  <div class="thai-clock">
    <div class="clock-row">
      <div class="time" id="clockTime">--:--<span class="sec">:--</span></div>
      <div class="period" id="clockPeriod">--</div>
    </div>
    <div class="date" id="clockDate">--</div>
  </div>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="ป้อนชื่องาน..." maxlength="80">
    <div class="time-picker">
      <select id="hourInput"></select>
      <span class="sep">:</span>
      <select id="minuteInput"></select>
      <select id="periodInput">
        <option value="AM">AM</option>
        <option value="PM">PM</option>
      </select>
    </div>
    <button class="primary" onclick="addTask()">+ ADD</button>
  </div>

  <label class="notify-toggle">
    <input type="checkbox" id="notifyToggle" checked>
    <span>// ENABLE_NOTIFICATIONS</span>
  </label>

  <div class="stats">
    <div>ALL<span><strong id="statAll">0</strong></span></div>
    <div>DONE<span><strong id="statDone">0</strong></span></div>
    <div>PENDING<span><strong id="statPending">0</strong></span></div>
  </div>

  <ul id="taskList"></ul>
</div>

<script>
  const STORAGE_KEY = 'shinichi_tasks_v1';
  const NOTIFIED_KEY = 'shinichi_notified_v1';
  const notifiedSet = new Set(JSON.parse(localStorage.getItem(NOTIFIED_KEY) || '[]'));
  let tasks = [];

  // ===== เวลาไทย =====
  const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                       'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

  const toBuddhistYear = y => y + 543;
  function to12Hour(h24) {
    const period = h24 < 12 ? 'AM' : 'PM';
    let h12 = h24 % 12; if (h12 === 0) h12 = 12;
    return { h12, period };
  }
  function to24Hour(h12, period) {
    let h = parseInt(h12, 10);
    if (period === 'AM') { if (h === 12) h = 0; }
    else { if (h !== 12) h += 12; }
    return h;
  }
  function thaiPeriod(h24) {
    if (h24 < 6)  return 'กลางคืน';
    if (h24 < 12) return 'เช้า';
    if (h24 < 13) return 'เที่ยง';
    if (h24 < 16) return 'บ่าย';
    if (h24 < 18) return 'เย็น';
    return 'ค่ำ';
  }
  function formatThaiTime(h24, m) {
    return `${String(h24).padStart(2,'0')}:${String(m).padStart(2,'0')} น. (${thaiPeriod(h24)})`;
  }

  // ===== Clock =====
  function updateClock() {
    const now = new Date();
    const h24 = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const { h12, period } = to12Hour(h24);
    document.getElementById('clockTime').innerHTML =
      `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')}<span class="sec">:${String(s).padStart(2,'0')}</span>`;
    document.getElementById('clockPeriod').innerHTML =
      `${period} // <span class="hl">${thaiPeriod(h24)}</span> // ${h24}:${String(m).padStart(2,'0')} น.`;
    document.getElementById('clockDate').textContent =
      `วัน${THAI_DAYS[now.getDay()]}ที่ ${now.getDate()} ${THAI_MONTHS[now.getMonth()]} พ.ศ. ${toBuddhistYear(now.getFullYear())}`;
  }

  // ===== Picker =====
  function initTimePickers() {
    const hourSel = document.getElementById('hourInput');
    const minSel = document.getElementById('minuteInput');
    for (let h = 1; h <= 12; h++) {
      const o = document.createElement('option');
      o.value = h; o.textContent = String(h).padStart(2,'0');
      hourSel.appendChild(o);
    }
    for (let m = 0; m < 60; m += 5) {
      const o = document.createElement('option');
      o.value = m; o.textContent = String(m).padStart(2,'0');
      minSel.appendChild(o);
    }
    const now = new Date();
    const { h12, period } = to12Hour(now.getHours());
    hourSel.value = h12;
    const roundedMin = Math.ceil(now.getMinutes() / 5) * 5 % 60;
    minSel.value = String(roundedMin).padStart(2,'0');
    if (!minSel.value) minSel.value = '00';
    document.getElementById('periodInput').value = period;
  }

  // ===== Data =====
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) tasks = JSON.parse(raw);
    } catch(e) { tasks = []; }
    sortTasks();
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    localStorage.setItem(NOTIFIED_KEY, JSON.stringify([...notifiedSet]));
  }
  function sortTasks() {
    tasks.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (!a.time24) return 1;
      if (!b.time24) return -1;
      return a.time24.localeCompare(b.time24);
    });
  }

  function addTask() {
    const textEl = document.getElementById('taskInput');
    const text = textEl.value.trim();
    if (!text) { textEl.focus(); return; }
    const h12 = document.getElementById('hourInput').value;
    const m = document.getElementById('minuteInput').value;
    const period = document.getElementById('periodInput').value;
    const h24 = to24Hour(h12, period);
    const time24 = String(h24).padStart(2,'0') + ':' + m;
    tasks.push({
      id: Date.now().toString(),
      text,
      time24,
      timeThai: formatThaiTime(h24, parseInt(m,10)),
      hour24: h24,
      minute: parseInt(m,10),
      done: false,
      createdAt: Date.now()
    });
    textEl.value = '';
    textEl.focus();
    sortTasks(); save(); render();
  }

  function toggleDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = !t.done; sortTasks(); save(); render(); }
  }
  function deleteTask(id) {
    tasks = tasks.filter(x => x.id !== id);
    save(); render();
  }

  function render() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty" style="border:none;background:transparent;">NO TASKS QUEUED</li>';
    } else {
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      tasks.forEach(t => {
        const li = document.createElement('li');
        let badge = '', cls = '';
        if (!t.done && t.hour24 !== undefined) {
          const taskMin = t.hour24 * 60 + t.minute;
          const diff = taskMin - nowMinutes;
          if (diff < 0) { cls = 'overdue'; badge = '<span class="badge overdue">OVERDUE</span>'; }
          else if (diff <= 30) { cls = 'soon'; badge = `<span class="badge soon">IN ${diff}M</span>`; }
        }
        if (t.done) li.classList.add('done');
        if (cls) li.classList.add(cls);
        const timeText = t.timeThai || (t.time24 ? `${t.time24} น.` : '--:--');
        li.innerHTML = `
          <div class="task-info" onclick="toggleDone('${t.id}')">
            <div class="task-text">${escapeHtml(t.text)}${badge}</div>
            <div class="task-time">${t.time24 ? '// ' + timeText : '// NO_TIME_SET'}</div>
          </div>
          <button class="icon-btn delete-btn" onclick="deleteTask('${t.id}')" title="ลบ">[×]</button>
        `;
        list.appendChild(li);
      });
    }
    const done = tasks.filter(t => t.done).length;
    document.getElementById('statAll').textContent = tasks.length;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statPending').textContent = tasks.length - done;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ===== Notification =====
  function requestPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') Notification.requestPermission();
  }
  function notify(title, body) {
    if (!document.getElementById('notifyToggle').checked) return;
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body }); }
      catch(e) { alert(title + '\n' + body); }
    } else {
      alert(title + '\n' + body);
    }
  }
  function checkReminders() {
    const now = new Date();
    const nowStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    tasks.forEach(t => {
      if (t.done || !t.time24) return;
      const key = t.id + '_' + t.time24;
      if (t.time24 === nowStr && !notifiedSet.has(key)) {
        notifiedSet.add(key);
        save();
        notify('⏰ ถึงเวลางาน!', `${t.text}\n(${t.timeThai})`);
      }
    });
  }

  // ===== Offline indicator =====
  window.addEventListener('online', () => {
    document.getElementById('offlineBadge').classList.remove('show');
  });
  window.addEventListener('offline', () => {
    document.getElementById('offlineBadge').classList.add('show');
  });
  if (!navigator.onLine) document.getElementById('offlineBadge').classList.add('show');

  // ===== Events =====
  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });
  document.getElementById('notifyToggle').addEventListener('change', e => {
    if (e.target.checked) requestPermission();
  });

  // ===== Start =====
  initTimePickers();
  load();
  render();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(checkReminders, 20000);
  setInterval(render, 30000);
  requestPermission();
  checkReminders();
</script>
</body>
</html>
